<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a Ninth Pass run executes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    @font-face {
      font-family: "Fraunces";
      src: url("../assets/fonts/fraunces-normal.woff2") format("woff2");
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Fraunces";
      src: url("../assets/fonts/fraunces-italic.woff2") format("woff2");
      font-style: italic;
      font-weight: 300 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Geist";
      src: url("../assets/fonts/geist.woff2") format("woff2");
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Geist Mono";
      src: url("../assets/fonts/geist-mono.woff2") format("woff2");
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
    }
    :root {
      --color-paper: #f3efe6;
      --color-paper-2: #fbf8f2;
      --color-ink: #1a1513;
      --color-muted: #4e4641;
      --color-soft: #6e625b;
      --color-accent: #a84b4b;
      --color-accent-tint: rgba(168,75,75,0.08);
      --color-rule: #d8cdbe;
      --color-rule-strong: #b6a793;
      --color-success: #2e6a4b;
      --color-chamber-soft: #c2b6a4;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 720ms;
      --motion-total: 3600ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1000px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 32px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 960px; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. body is a centred
       grid, so the root needs max-width/min-width to stop the grid item from
       sizing itself to the SVG's max-content width. */
    [data-motion-root] { max-width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      /* Paper has no scrollbar, so the local scroller would clip instead of
         scroll. Let the diagram scale down to the sheet: smaller but whole
         beats sharp but cut off. */
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main data-motion-root data-motion-mode="reveal" data-step-count="5" data-step-current="5" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Run, a fresh process per stage</p>
    <h1>What crosses the boundary is a file</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pz-df-title pz-df-desc">
        <title id="pz-df-title">How a Ninth Pass run executes</title>
        <desc id="pz-df-desc">A request is handed to a fresh process for each stage, in this case the offline test worker, which makes no model call. Compose, Judge, Revise and a second Judge each run in their own process, and each writes one file into the run directory. Nothing is carried in memory between stages; the file the previous stage wrote is the only thing that crosses the boundary. A score of 9 or 10 writes the approved prompt to the prompts directory.</desc>
        <defs>
          <pattern id="pz-df-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="11" cy="11" r="0.8" fill="#1a1513" opacity="0.08"/>
          </pattern>
          <marker id="pz-df-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4e4641"/>
          </marker>
        </defs>
        <rect width="960" height="640" fill="#f3efe6"/>
        <rect width="960" height="640" fill="url(#pz-df-dots)"/>

        <!-- The request enters the first process. -->
        <g data-motion-item data-step="1" aria-label="Step 1: the request, one sentence">
          <rect x="56" y="24" width="396" height="58" rx="6" fill="#fbf8f2" stroke="#d8cdbe"/>
          <text x="76" y="46" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">REQUEST</text>
          <text x="76" y="68" fill="#1a1513" font-family="'Geist', sans-serif" font-size="14" font-weight="600">Write a prompt for a meeting-notes summarizer</text>
        </g>
        <path d="M254 82 V102" fill="none" stroke="#4e4641" marker-end="url(#pz-df-arrow)"/>

        <!-- Stage processes. A dashed edge is a process boundary. -->
        <g data-motion-item data-step="1" aria-label="Step 1: Compose runs in a fresh process and writes 01-compose.md">
          <rect x="56" y="108" width="396" height="86" rx="8" fill="#f3efe6" stroke="#b6a793" stroke-dasharray="5,4"/>
          <text x="76" y="132" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">FRESH PROCESS · OFFLINE TEST WORKER</text>
          <text x="76" y="158" fill="#1a1513" font-family="'Geist', sans-serif" font-size="17" font-weight="600">Compose</text>
          <text x="76" y="180" fill="#4e4641" font-family="'Geist Mono', monospace" font-size="9">writes the System Prompt and the Task Prompt</text>
        </g>

        <g data-motion-item data-step="2" aria-label="Step 2: Judge runs in a fresh process and writes 02-judge-pass1.md">
          <rect x="56" y="220" width="396" height="86" rx="8" fill="#f3efe6" stroke="#b6a793" stroke-dasharray="5,4"/>
          <text x="76" y="244" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">FRESH PROCESS · OFFLINE TEST WORKER</text>
          <text x="76" y="270" fill="#1a1513" font-family="'Geist', sans-serif" font-size="17" font-weight="600">Judge</text>
          <text x="76" y="292" fill="#4e4641" font-family="'Geist Mono', monospace" font-size="9">scores the prompt against the locked rubric</text>
        </g>

        <g data-motion-item data-step="3" aria-label="Step 3: Revise runs in a fresh process and writes 03-revise.md">
          <rect x="56" y="332" width="396" height="86" rx="8" fill="#f3efe6" stroke="#b6a793" stroke-dasharray="5,4"/>
          <text x="76" y="356" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">FRESH PROCESS · OFFLINE TEST WORKER</text>
          <text x="76" y="382" fill="#1a1513" font-family="'Geist', sans-serif" font-size="17" font-weight="600">Revise</text>
          <text x="76" y="404" fill="#4e4641" font-family="'Geist Mono', monospace" font-size="9">applies every recommendation and returns the rewrite</text>
        </g>

        <g data-motion-item data-step="4" aria-label="Step 4: the second Judge runs in a fresh process and writes 04-judge-pass2.md">
          <rect x="56" y="444" width="396" height="86" rx="8" fill="#f3efe6" stroke="#b6a793" stroke-dasharray="5,4"/>
          <text x="76" y="468" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">FRESH PROCESS · OFFLINE TEST WORKER</text>
          <text x="76" y="494" fill="#1a1513" font-family="'Geist', sans-serif" font-size="17" font-weight="600">Judge</text>
          <text x="76" y="516" fill="#4e4641" font-family="'Geist Mono', monospace" font-size="9">scores the rewritten prompt — 9 out of 10 — STOP</text>
        </g>

        <!-- The file is the payload. Each label names the file that crosses. -->
        <g data-motion-item data-step="1" aria-label="01-compose.md crosses into the next process">
          <path d="M254 194 V216" fill="none" stroke="#4e4641" marker-end="url(#pz-df-arrow)"/>
          <text x="270" y="210" fill="#7a2b2b" font-family="'Geist Mono', monospace" font-size="9">01-compose.md</text>
        </g>
        <g data-motion-item data-step="2" aria-label="02-judge-pass1.md crosses into the next process">
          <path d="M254 306 V328" fill="none" stroke="#4e4641" marker-end="url(#pz-df-arrow)"/>
          <text x="270" y="322" fill="#7a2b2b" font-family="'Geist Mono', monospace" font-size="9">02-judge-pass1.md</text>
        </g>
        <g data-motion-item data-step="3" aria-label="03-revise.md crosses into the next process">
          <path d="M254 418 V440" fill="none" stroke="#4e4641" marker-end="url(#pz-df-arrow)"/>
          <text x="270" y="434" fill="#7a2b2b" font-family="'Geist Mono', monospace" font-size="9">03-revise.md</text>
        </g>
        <g data-motion-item data-step="4" aria-label="04-judge-pass2.md crosses into the next process">
          <path d="M254 530 V552" fill="none" stroke="#4e4641" marker-end="url(#pz-df-arrow)"/>
          <text x="270" y="546" fill="#7a2b2b" font-family="'Geist Mono', monospace" font-size="9">04-judge-pass2.md</text>
        </g>

        <!-- Each process deposits one file in the run directory. -->
        <path d="M452 151 H492" fill="none" stroke="#b6a793" stroke-dasharray="2,3"/>
        <path d="M452 263 H492" fill="none" stroke="#b6a793" stroke-dasharray="2,3"/>
        <path d="M452 375 H492" fill="none" stroke="#b6a793" stroke-dasharray="2,3"/>
        <path d="M452 487 H492" fill="none" stroke="#b6a793" stroke-dasharray="2,3"/>

        <!-- The run directory accumulates the run. -->
        <g data-motion-item data-step="1" aria-label="The run directory">
          <text x="500" y="32" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">RUN DIRECTORY</text>
          <rect x="500" y="44" width="404" height="248" rx="6" fill="#fbf8f2" stroke="#d8cdbe"/>
        </g>

        <g data-motion-item data-step="1" aria-label="File 00-request.md, the input">
          <text x="516" y="76" fill="#4e4641" font-family="'Geist Mono', monospace" font-size="10">00-request.md</text>
          <text x="888" y="76" text-anchor="end" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.1em">INPUT</text>
        </g>
        <g data-motion-item data-step="1" aria-label="File 01-compose.md, written by Compose">
          <text x="516" y="108" fill="#4e4641" font-family="'Geist Mono', monospace" font-size="10">01-compose.md</text>
          <text x="888" y="108" text-anchor="end" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.1em">WRITTEN</text>
        </g>
        <g data-motion-item data-step="2" aria-label="File 02-judge-pass1.md, scored 8 out of 10, CONTINUE">
          <text x="516" y="140" fill="#4e4641" font-family="'Geist Mono', monospace" font-size="10">02-judge-pass1.md</text>
          <text x="888" y="140" text-anchor="end" fill="#a84b4b" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.1em">8 / CONTINUE</text>
        </g>
        <g data-motion-item data-step="3" aria-label="File 03-revise.md, the rewritten prompt">
          <text x="516" y="172" fill="#4e4641" font-family="'Geist Mono', monospace" font-size="10">03-revise.md</text>
          <text x="888" y="172" text-anchor="end" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.1em">WRITTEN</text>
        </g>
        <g data-motion-item data-step="4" aria-label="File 04-judge-pass2.md, scored 9 out of 10, STOP">
          <text x="516" y="204" fill="#4e4641" font-family="'Geist Mono', monospace" font-size="10">04-judge-pass2.md</text>
          <text x="888" y="204" text-anchor="end" fill="#2e6a4b" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.1em">9 / STOP</text>
        </g>
        <g data-motion-item data-step="5" aria-label="The approved prompt, written to prompts/meeting-notes.md">
          <path d="M516 226 H888" stroke="#d8cdbe"/>
          <text x="516" y="254" fill="#1a1513" font-family="'Geist Mono', monospace" font-size="10" font-weight="600">prompts/meeting-notes.md</text>
          <text x="888" y="254" text-anchor="end" fill="#2e6a4b" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.1em">APPROVED</text>
        </g>

        <!-- The point of the diagram. -->
        <g data-motion-item data-step="1" aria-label="Nothing is carried in memory between stages">
          <text x="500" y="336" fill="#1a1513" font-family="'Geist', sans-serif" font-size="15" font-weight="600">Nothing is carried in memory.</text>
          <text x="500" y="358" fill="#4e4641" font-family="'Geist Mono', monospace" font-size="9">Each stage starts a new process and reads the</text>
          <text x="500" y="374" fill="#4e4641" font-family="'Geist Mono', monospace" font-size="9">file the previous stage wrote.</text>
        </g>

        <!-- The three end states, as the run directory records them. -->
        <g data-motion-item data-step="5" aria-label="The end states: approved, provisional, paused">
          <path d="M500 402 H904" stroke="#d8cdbe"/>
          <text x="500" y="428" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="9">9 or 10 → approved</text>
          <text x="500" y="450" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="9">4 rounds without STOP → provisional</text>
          <text x="500" y="472" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="9">2 rewrites without improvement → paused</text>
        </g>

        <!-- The approved artifact. -->
        <g data-motion-item data-step="5" aria-label="Step 5: the approved prompt is written to prompts/meeting-notes.md">
          <rect x="56" y="556" width="396" height="68" rx="6" fill="#1a1513"/>
          <text x="76" y="584" fill="#f3efe6" font-family="'Geist', sans-serif" font-size="16" font-weight="600">Approved prompt</text>
          <text x="76" y="606" fill="#c2b6a4" font-family="'Geist Mono', monospace" font-size="9">prompts/meeting-notes.md</text>
        </g>
      </svg>
    </div>

    <div data-motion-controls role="group" aria-label="Diagram playback controls">
      <button type="button" data-motion-action="prev">Previous</button>
      <button type="button" data-motion-action="play" aria-pressed="false">Play</button>
      <button type="button" data-motion-action="pause" aria-pressed="true">Pause</button>
      <button type="button" data-motion-action="next">Next</button>
      <button type="button" data-motion-action="replay">Replay</button>
      <span class="keyboard-help">←/→ step, Space play/pause, R replay, Home/End jump</span>
      <span data-motion-status-visible aria-hidden="true">Step <span data-motion-step-label>5</span> of 5</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
