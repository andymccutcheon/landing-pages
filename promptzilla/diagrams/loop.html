<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Promptzilla refinement loop</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    @font-face {
      font-family: "Fraunces";
      src: url("../assets/fonts/fraunces-normal.woff2") format("woff2");
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Fraunces";
      src: url("../assets/fonts/fraunces-italic.woff2") format("woff2");
      font-style: italic;
      font-weight: 300 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Geist";
      src: url("../assets/fonts/geist.woff2") format("woff2");
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
    }
    @font-face {
      font-family: "Geist Mono";
      src: url("../assets/fonts/geist-mono.woff2") format("woff2");
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
    }
    :root {
      --color-paper: #f3efe6;
      --color-paper-2: #fbf8f2;
      --color-ink: #1a1513;
      --color-muted: #4e4641;
      --color-soft: #6e625b;
      --color-accent: #a84b4b;
      --color-accent-tint: rgba(168,75,75,0.08);
      --color-rule: #d8cdbe;
      --color-success: #2e6a4b;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
      --motion-fast: 160ms;
      --motion-step: 480ms;
      --motion-hold: 720ms;
      --motion-total: 3600ms;
      --motion-ease: cubic-bezier(.2,.8,.2,1);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 32px;
      color: var(--color-ink);
      background: var(--color-paper);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1000px); }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 32px/1.15 var(--font-serif); }
    svg { display: block; width: 100%; min-width: 960px; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. body is a centred
       grid, so the root needs max-width/min-width to stop the grid item from
       sizing itself to the SVG's max-content width. */
    [data-motion-root] { max-width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    /* Static source is complete. Only an initialized enhancement hides items. */
    .motion-ready [data-motion-item] {
      opacity: .12;
      transform: translateY(8px);
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity var(--motion-step) var(--motion-ease),
                  transform var(--motion-step) var(--motion-ease);
    }
    .motion-ready [data-motion-item].is-visible,
    .motion-ready[data-frame="end"] [data-motion-item],
    .motion-ready[data-frame="static"] [data-motion-item] {
      opacity: 1;
      transform: none;
    }
    .draw-path {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 3;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      pointer-events: none;
    }
    .motion-ready .draw-path.is-visible {
      animation: draw-path var(--motion-step) linear forwards;
    }
    .flow-token { opacity: 0; pointer-events: none; }
    .motion-ready.is-playing .flow-token.is-visible {
      opacity: 1;
      animation: token-flow 3.2s linear 1 forwards;
    }
    .motion-ready[data-motion-mode="loop"].is-playing .flow-token.is-visible {
      animation-iteration-count: infinite;
    }
    @keyframes draw-path { to { stroke-dashoffset: 0; } }
    @keyframes token-flow {
      0% { transform: translateX(0); }
      100% { transform: translateX(240px); }
    }

    [data-motion-controls] {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--color-rule);
    }
    .motion-ready [data-motion-controls] { display: flex; }
    [data-motion-controls][hidden] { display: none !important; }
    [data-motion-controls] button {
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--color-muted);
      border-radius: 4px;
      color: var(--color-ink);
      background: var(--color-paper);
      font: 600 12px/1 var(--font-sans);
      cursor: pointer;
    }
    [data-motion-controls] button:hover { border-color: var(--color-accent); }
    [data-motion-controls] button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }
    [data-motion-controls] button:disabled { cursor: not-allowed; opacity: .45; }
    [data-motion-status-visible] {
      margin-left: auto;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    noscript p {
      margin: 12px 0 0;
      color: var(--color-muted);
      font: 500 12px/1.4 var(--font-mono);
    }

    html[data-motion="static"] [data-motion-controls],
    html[data-motion="static"] [data-motion-decorative] { display: none !important; }
    html[data-motion="static"] [data-motion-item] {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
      transition: none !important;
    }
    html[data-motion="step"] [data-motion-controls],
    html[data-motion="step"] [data-motion-decorative] { display: none !important; }
    html[data-motion="step"] [data-motion-item] {
      animation: none !important;
      transition: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
      [data-motion-item] { opacity: 1 !important; transform: none !important; }
      [data-motion-decorative] { display: none !important; }
      [data-motion-controls] { display: none !important; }
    }
    @media print {
      /* Paper has no scrollbar, so the local scroller would clip instead of
         scroll. Let the diagram scale down to the sheet: smaller but whole
         beats sharp but cut off. */
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
      [data-motion-controls], [data-motion-decorative] { display: none !important; }
      [data-motion-item] {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- Replace template-motion in IDs and prose when copying this file. -->
  <main data-motion-root data-motion-mode="reveal" data-step-count="5" data-step-current="5" data-frame="static" data-static-frame="complete">
    <p class="eyebrow">Process · three skills · one gate</p>
    <h1>The refinement loop</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pz-loop-title pz-loop-desc">
        <title id="pz-loop-title">The Promptzilla refinement loop</title>
        <desc id="pz-loop-desc">A request is composed into a System Prompt and a Task Prompt, judged on a locked rubric, revised, and judged again. A score of 9 or 10 stops the loop and approves the prompt. Four passes without STOP produce a provisional prompt; two rewrites without improvement pause the run.</desc>
        <defs>
          <pattern id="pz-loop-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="11" cy="11" r="0.8" fill="#1a1513" opacity="0.08"/>
          </pattern>
          <marker id="pz-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4e4641"/>
          </marker>
          <marker id="pz-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#a84b4b"/>
          </marker>
          <marker id="pz-loop-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#6e625b"/>
          </marker>
        </defs>
        <rect width="960" height="600" fill="#f3efe6"/>
        <rect width="960" height="600" fill="url(#pz-loop-dots)"/>

        <!-- Semantic connectors are always visible. The nodes reveal in order. -->
        <path d="M480 106 V140" fill="none" stroke="#4e4641" marker-end="url(#pz-loop-arrow)"/>
        <path d="M480 204 V230" fill="none" stroke="#4e4641" marker-end="url(#pz-loop-arrow)"/>
        <path d="M610 300 H740" fill="none" stroke="#a84b4b" stroke-width="1.2" marker-end="url(#pz-loop-arrow-accent)"/>
        <path d="M480 370 V430" fill="none" stroke="#4e4641" marker-end="url(#pz-loop-arrow)"/>
        <path d="M370 462 H300 V300 H350" fill="none" stroke="#6e625b" stroke-dasharray="5,4" marker-end="url(#pz-loop-arrow-soft)"/>

        <!-- Decision labels sit on opaque masks, clear of their strokes. -->
        <rect x="645" y="282" width="92" height="16" fill="#f3efe6"/>
        <text x="691" y="294" text-anchor="middle" fill="#a84b4b" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.08em">YES · 9 OR 10</text>
        <rect x="494" y="386" width="78" height="16" fill="#f3efe6"/>
        <text x="533" y="398" text-anchor="middle" fill="#4e4641" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.08em">NO · CONTINUE</text>
        <rect x="234" y="404" width="60" height="16" fill="#f3efe6"/>
        <text x="290" y="416" text-anchor="end" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.08em">NEXT PASS</text>

        <!-- Run scorecard: a static annotation; its two rows reveal with the two Judge passes. -->
        <rect x="60" y="160" width="220" height="104" rx="4" fill="#fbf8f2" stroke="#d8cdbe"/>
        <text x="72" y="184" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em">RUN 0042 / MEETING NOTES</text>
        <path d="M72 196 H268" stroke="#d8cdbe"/>
        <g data-motion-item data-step="2" aria-label="Step 2: first Judge pass, 8 out of 10, CONTINUE">
          <text x="72" y="220" fill="#4e4641" font-family="'Geist Mono', monospace" font-size="9">PASS 1</text>
          <text x="268" y="220" text-anchor="end" fill="#a84b4b" font-family="'Geist Mono', monospace" font-size="9">8 / CONTINUE</text>
        </g>
        <g data-motion-item data-step="4" aria-label="Step 4: second Judge pass, 9 out of 10, STOP">
          <text x="72" y="244" fill="#4e4641" font-family="'Geist Mono', monospace" font-size="9">PASS 2</text>
          <text x="268" y="244" text-anchor="end" fill="#2e6a4b" font-family="'Geist Mono', monospace" font-size="9">9 / STOP</text>
        </g>

        <g data-motion-item data-step="1" aria-label="Step 1: a raw request">
          <rect x="370" y="34" width="220" height="72" rx="36" fill="#f3efe6" stroke="#1a1513" stroke-width="1.2"/>
          <text x="480" y="66" text-anchor="middle" fill="#1a1513" font-family="'Geist', sans-serif" font-size="16" font-weight="600">Raw request</text>
          <text x="480" y="86" text-anchor="middle" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="10">one sentence</text>
        </g>

        <g data-motion-item data-step="1" aria-label="Step 1: Compose writes the System and Task Prompts">
          <rect x="370" y="140" width="220" height="64" rx="6" fill="#f3efe6" stroke="#1a1513" stroke-width="1.2"/>
          <text x="480" y="170" text-anchor="middle" fill="#1a1513" font-family="'Geist', sans-serif" font-size="16" font-weight="600">Compose</text>
          <text x="480" y="190" text-anchor="middle" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="10">System + Task Prompt</text>
        </g>

        <g data-motion-item data-step="2" aria-label="Step 2: Judge scores against the locked rubric">
          <path d="M480 230 L610 300 L480 370 L350 300 Z" fill="rgba(168,75,75,0.08)" stroke="#a84b4b" stroke-width="1.4"/>
          <text x="480" y="294" text-anchor="middle" fill="#1a1513" font-family="'Geist', sans-serif" font-size="16" font-weight="600">Judge</text>
          <text x="480" y="314" text-anchor="middle" fill="#4e4641" font-family="'Geist Mono', monospace" font-size="10">locked rubric</text>
          <text x="480" y="332" text-anchor="middle" fill="#a84b4b" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.08em">9 OR 10?</text>
        </g>

        <g data-motion-item data-step="3" aria-label="Step 3: Revise applies every recommendation and the loop returns">
          <rect x="370" y="430" width="220" height="64" rx="6" fill="#f3efe6" stroke="#1a1513" stroke-width="1.2"/>
          <text x="480" y="460" text-anchor="middle" fill="#1a1513" font-family="'Geist', sans-serif" font-size="16" font-weight="600">Revise</text>
          <text x="480" y="480" text-anchor="middle" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="10">apply every recommendation</text>
        </g>

        <g data-motion-item data-step="4" aria-label="Step 4: the second Judge pass returns STOP">
          <rect x="645" y="282" width="92" height="16" fill="#f3efe6"/>
          <text x="691" y="294" text-anchor="middle" fill="#a84b4b" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.08em">YES · 9 OR 10</text>
        </g>

        <g data-motion-item data-step="5" aria-label="Step 5: the prompt is approved">
          <rect x="740" y="268" width="180" height="64" rx="32" fill="#1a1513" stroke="#1a1513"/>
          <text x="830" y="294" text-anchor="middle" fill="#f3efe6" font-family="'Geist', sans-serif" font-size="16" font-weight="600">Approved</text>
          <text x="830" y="314" text-anchor="middle" fill="#c2b6a4" font-family="'Geist Mono', monospace" font-size="9">prompts/&lt;slug&gt;.md</text>
        </g>

        <g data-motion-item data-step="5" aria-label="Step 5: the cap and plateau outcomes">
          <path d="M60 522 H360" stroke="#d8cdbe"/>
          <text x="60" y="544" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="9">4 passes without STOP → provisional</text>
          <text x="60" y="564" fill="#6e625b" font-family="'Geist Mono', monospace" font-size="9">2 rewrites without improvement → paused</text>
        </g>
      </svg>
    </div>

    <div data-motion-controls role="group" aria-label="Diagram playback controls">
      <button type="button" data-motion-action="prev">Previous</button>
      <button type="button" data-motion-action="play" aria-pressed="false">Play</button>
      <button type="button" data-motion-action="pause" aria-pressed="true">Pause</button>
      <button type="button" data-motion-action="next">Next</button>
      <button type="button" data-motion-action="replay">Replay</button>
      <span class="keyboard-help">←/→ step · Space play/pause · R replay · Home/End jump</span>
      <span data-motion-status-visible aria-hidden="true">Step <span data-motion-step-label>5</span> of 5</span>
    </div>
    <p class="sr-only" data-motion-status role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript><p>Animation controls require JavaScript. The complete final diagram is shown above.</p></noscript>
  </main>

  <script data-diagram-controls>
    (() => {
      const params = new URLSearchParams(location.search);
      const staticOverride = params.get('motion') === 'static' || document.documentElement.dataset.motion === 'static';
      const requestedStep = params.get('step');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      document.fonts.ready.then(() => { document.documentElement.dataset.fontsReady = 'true'; });

      document.querySelectorAll('[data-motion-root]').forEach((root) => {
        const count = Number(root.dataset.stepCount);
        const hold = parseFloat(getComputedStyle(root).getPropertyValue('--motion-hold')) || 720;
        const parsedStep = requestedStep !== null && /^\d+$/.test(requestedStep) ? Number(requestedStep) : null;
        const exactStep = params.get('motion') === 'step' && Number.isSafeInteger(parsedStep) && parsedStep >= 0 && parsedStep <= count ? parsedStep : null;
        const items = [...root.querySelectorAll('[data-motion-item]')];
        const labels = Array.from({ length: count + 1 }, (_, index) => index === 0
          ? 'Ready'
          : items.filter((item) => !item.hasAttribute('data-motion-decorative') && Number(item.dataset.step) === index)
              .map((item) => item.getAttribute('aria-label')).join('; '));
        const controls = root.querySelector('[data-motion-controls]');
        const status = root.querySelector('[data-motion-status]');
        const visibleStep = root.querySelector('[data-motion-step-label]');
        let step = count;
        let timer = 0;
        let playing = false;
        let stepBeforeReduce = 0;
        let resumeAfterReduce = root.dataset.motionMode === 'reveal';

        const buttons = (action) => controls.querySelector(`[data-motion-action="${action}"]`);
        const clearClock = () => { window.clearTimeout(timer); timer = 0; };
        const announce = () => { status.textContent = `Step ${step} of ${count}: ${labels[step] || 'Complete'}`; };
        const setControlsAvailable = (available) => {
          controls.hidden = !available;
          controls.setAttribute('aria-hidden', String(!available));
          controls.dataset.playbackDisabled = String(!available);
          controls.querySelectorAll('button').forEach((control) => { control.disabled = !available; });
        };

        function render(next, userInitiated = false) {
          step = Math.max(0, Math.min(count, next));
          root.dataset.stepCurrent = String(step);
          root.dataset.frame = step === count ? 'end' : step === 0 ? 'start' : 'step';
          items.forEach((item) => {
            const itemStep = Number(item.dataset.step);
            item.classList.toggle('is-visible', itemStep <= step);
            item.classList.toggle('is-current', itemStep === step);
          });
          if (visibleStep) visibleStep.textContent = String(step);
          const unavailable = controls.dataset.playbackDisabled === 'true';
          buttons('prev').disabled = unavailable || step === 0;
          buttons('next').disabled = unavailable || step === count;
          if (userInitiated) announce();
        }

        function pause(userInitiated = false) {
          clearClock();
          playing = false;
          root.classList.remove('is-playing');
          buttons('play').setAttribute('aria-pressed', 'false');
          buttons('pause').setAttribute('aria-pressed', 'true');
          if (userInitiated) status.textContent = `Paused at step ${step} of ${count}`;
        }

        function finish() {
          pause(false);
          root.dataset.frame = 'end';
          status.textContent = `Complete · step ${count} of ${count}`;
        }

        function tick() {
          if (!playing) return;
          if (step >= count) { finish(); return; }
          render(step + 1, false);
          if (step >= count) { finish(); return; }
          timer = window.setTimeout(tick, hold);
        }

        function play(fromStart = false, userInitiated = false) {
          clearClock();
          if (fromStart || step >= count) render(0, userInitiated);
          playing = true;
          root.classList.add('is-playing');
          buttons('play').setAttribute('aria-pressed', 'true');
          buttons('pause').setAttribute('aria-pressed', 'false');
          timer = window.setTimeout(tick, hold);
        }

        controls.addEventListener('click', (event) => {
          const button = event.target.closest('[data-motion-action]');
          if (!button) return;
          const action = button.dataset.motionAction;
          if (action === 'play') play(false, true);
          if (action === 'pause') pause(true);
          if (action === 'replay') play(true, true);
          if (action === 'prev') { pause(false); render(step - 1, true); }
          if (action === 'next') { pause(false); render(step + 1, true); }
        });

        root.addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea, select, a[href]')) return;
          const keys = { ArrowLeft: step - 1, ArrowRight: step + 1, Home: 0, End: count };
          if (event.code === 'Space' && !event.target.closest('button')) {
            event.preventDefault();
            playing ? pause(true) : play(false, true);
            return;
          }
          if (!event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'r') {
            event.preventDefault();
            play(true, true);
            return;
          }
          if (!(event.key in keys)) return;
          event.preventDefault();
          pause(false);
          render(keys[event.key], true);
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden' && playing) pause(false);
        });
        reduce.addEventListener('change', (event) => {
          if (event.matches && root.dataset.motionState !== 'reduced') {
            stepBeforeReduce = step;
            resumeAfterReduce = playing;
          }
          pause(false);
          if (event.matches) {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'reduced';
            status.textContent = 'Reduced motion · complete static frame · playback controls unavailable';
          } else if (staticOverride || root.dataset.motionMode === 'none') {
            setControlsAvailable(false);
            render(count, false);
            root.dataset.frame = 'static';
            root.dataset.motionState = 'static';
            status.textContent = 'Static frame · complete diagram · playback controls unavailable';
          } else {
            delete root.dataset.motionState;
            if (exactStep !== null) {
              setControlsAvailable(false);
              render(exactStep, false);
              root.dataset.frame = 'step';
              root.dataset.motionState = 'test';
              status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
            } else {
              setControlsAvailable(true);
              render(stepBeforeReduce, false);
              status.textContent = `Ready · step ${step} of ${count}`;
              if (resumeAfterReduce && root.dataset.motionMode === 'reveal') {
                play(false, false);
              }
            }
            resumeAfterReduce = false;
          }
        });

        if (staticOverride) {
          document.documentElement.dataset.motion = 'static';
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = 'static';
          status.textContent = 'Static frame · complete diagram · playback controls unavailable';
        } else if (reduce.matches || root.dataset.motionMode === 'none') {
          pause(false);
          setControlsAvailable(false);
          render(count, false);
          root.dataset.frame = 'static';
          root.dataset.motionState = reduce.matches ? 'reduced' : 'static';
          status.textContent = reduce.matches
            ? 'Reduced motion · complete static frame · playback controls unavailable'
            : 'Static frame · complete diagram · playback controls unavailable';
        } else if (exactStep !== null) {
          document.documentElement.dataset.motion = 'step';
          pause(false);
          setControlsAvailable(false);
          render(exactStep, false);
          root.dataset.frame = 'step';
          root.dataset.motionState = 'test';
          status.textContent = `Test frame · step ${step} of ${count} · playback controls unavailable`;
        } else if (root.dataset.motionMode === 'reveal') {
          setControlsAvailable(true);
          render(0, false);
          play(false, false);
        } else {
          pause(false);
          setControlsAvailable(true);
          render(0, false);
          status.textContent = `Ready · step 0 of ${count}`;
        }
        root.classList.add('motion-ready');
      });
    })();
  </script>
</body>
</html>
